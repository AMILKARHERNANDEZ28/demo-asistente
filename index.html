<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Asistente · Demostración</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#1b1612;display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;background:#EFE7DD;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.phone{height:92vh;max-height:900px;border-radius:36px;border:10px solid #0f0c0a;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.top{background:#1F2C34;color:#fff;display:flex;align-items:center;gap:10px;padding:14px 14px 12px}
.top img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff}
.top b{font-size:16px;display:block}.top small{font-size:12px;color:#9fb3bd}
.demo{background:#C9A96E;color:#1F2C34;font-size:11px;font-weight:700;letter-spacing:.08em;text-align:center;padding:4px;text-transform:uppercase}
.chat{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:7px 10px 17px;border-radius:9px;font-size:15px;line-height:1.38;position:relative;color:#111;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-line;animation:in .18s ease-out}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
.m .t{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:#7b8a8f}
.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.out{background:#D9FDD3;align-self:flex-end;border-top-right-radius:2px}
.ai{display:block;font-size:11px;font-weight:700;color:#8C6D3A;margin-bottom:2px}
.sep{align-self:center;background:#E1F2FB;color:#54656f;font-size:12px;padding:5px 12px;border-radius:8px;margin:6px 0;text-align:center}
.typing{align-self:flex-start;background:#fff;border-radius:9px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.loc{align-self:flex-start;width:78%;background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.loc div{height:96px;background:linear-gradient(135deg,#d7e8d0,#cfe0ea);display:flex;align-items:center;justify-content:center;font-size:30px}
.loc p{font-size:13px;padding:8px 10px}
.btns{align-self:flex-start;width:78%;display:flex;flex-direction:column;gap:4px}
.btns button{font:inherit;cursor:pointer;border:none;background:#fff;color:#0a7cff;font-weight:600;font-size:14px;padding:9px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.bar{display:flex;gap:8px;padding:8px 10px 12px;background:#EFE7DD}
.bar input{flex:1;font:inherit;font-size:16px;border:none;border-radius:22px;padding:11px 16px;outline:none}
.bar button{width:46px;height:46px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:20px;cursor:pointer}
.empty{color:#EFE7DD;text-align:center;padding:40px;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div class="phone" id="app" hidden>
  <div class="top"><img id="logo" alt=""><div><b id="nom"></b><small id="st">en línea</small></div></div>
  <div class="demo">Demostración interactiva del asistente</div>
  <div class="chat" id="chat"><div class="sep">HOY</div></div>
  <form class="bar" id="f"><input id="q" placeholder="Escriba un mensaje" autocomplete="off" aria-label="Mensaje"><button aria-label="Enviar">➤</button></form>
</div>
<p class="empty" id="vacio" hidden>Demostración de asistente virtual.<br>Escanee el código que le compartieron para probarla.</p>
<script>
// Motor genérico: el comportamiento de cada cliente vive en c/<id>.json (?c=<id>).
const id = new URLSearchParams(location.search).get('c');
let C = null, esperandoHora = false;
const chat = document.getElementById('chat'), st = document.getElementById('st');

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function hora(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function add(el){ chat.appendChild(el); chat.scrollTop = chat.scrollHeight; return el; }
function msg(text, cls, quien){
  const d=document.createElement('div'); d.className='m '+cls;
  if(quien){ const s=document.createElement('span'); s.className='ai'; s.textContent=quien; d.appendChild(s); }
  d.appendChild(document.createTextNode(text));
  const t=document.createElement('span'); t.className='t'; t.textContent=hora()+(cls==='out'?' ✓✓':''); d.appendChild(t);
  return add(d);
}
function sep(text){ const d=document.createElement('div'); d.className='sep'; d.textContent=text; add(d); }
function botones(opts){
  const w=document.createElement('div'); w.className='btns';
  opts.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.textContent=o; b.onclick=()=>{ w.remove(); enviar(o); }; w.appendChild(b); });
  add(w);
}
function ubicacion(){ const d=document.createElement('div'); d.className='loc'; d.innerHTML='<div>📍</div>'; const p=document.createElement('p'); p.textContent=C.nombre+' · '+C.sede.nombre+' — '+C.sede.direccion; d.appendChild(p); add(d); }

// Cola de respuestas con "escribiendo…"
function responder(pasos){
  let i=0;
  const sig=()=>{
    if(i>=pasos.length){ st.textContent='en línea'; return; }
    const p=pasos[i++];
    if(p.pausa){ setTimeout(sig,p.pausa); return; }
    if(p.inmediato){ p(); sig(); return; }
    st.textContent='escribiendo…';
    const ty=document.createElement('div'); ty.className='typing'; ty.innerHTML='<i></i><i></i><i></i>'; add(ty);
    setTimeout(()=>{ ty.remove(); p(); sig(); }, 900 + Math.min(1400, 12*(p.len||60)));
  };
  sig();
}
function ia(text, extra){ const f=()=>{ msg(text,'in',C.rol); if(extra) extra(); }; f.len=text.length; return f; }
function pausa(ms){ return {pausa:ms}; }
function separador(text){ const f=()=>sep(text); f.inmediato=true; return f; }
function oferta(){ return 'Tengo disponible mañana a las '+C.horas[0]+' o a las '+C.horas[1]+'. ¿Cuál le acomoda mejor?'; }
function ofrecer(intro){ esperandoHora=true; return [ia(intro+'\n\n'+oferta(), ()=>botones(C.horas))]; }
function tiene(s, palabras){ return palabras.some(p=>s.includes(norm(p))); }

function confirmar(h){
  return [
    ia('Listo ✅ '+C.cita.charAt(0).toUpperCase()+C.cita.slice(1)+' quedó agendada para mañana a las '+h+' en '+C.sede.nombre+'.\n\nLe dejo la ubicación:', ubicacion),
    ia('Un día antes le enviaré un recordatorio para confirmar 📅'),
    pausa(2200), separador('UN DÍA ANTES (SIMULADO)'),
    ia('📅 Le recordamos '+C.cita+' de mañana a las '+h+' en '+C.sede.nombre+'. ¿Nos confirma su asistencia?', ()=>botones(['✅ Confirmar','🔁 Reprogramar']))
  ];
}
function intencion(t){
  const s=norm(t);
  if(esperandoHora){
    const h=C.horas.find(x=>s.includes(x.split(':')[0])) || (/tarde/.test(s)?C.horas[1]:(/manana|temprano|primera/.test(s)?C.horas[0]:null));
    if(h){ esperandoHora=false; return confirmar(h); }
  }
  if(tiene(s,C.urgencia.palabras)) return [ia(C.urgencia.respuesta), pausa(900), separador(C.urgencia.aviso), ia(C.urgencia.seguimiento)];
  for(const it of C.intenciones){ if(tiene(s,it.palabras)) return ofrecer(it.respuesta); }
  if(/donde|ubica|direcc|sede|llegar|mapa/.test(s)) return [ia(C.ubicacion, ubicacion), ia('¿Desea que le agende una cita? '+oferta(), ()=>{ esperandoHora=true; botones(C.horas); })];
  if(/horario|atienden|abren|cierran|sabado|domingo|hora/.test(s)) return ofrecer(C.horario);
  if(/cita|agend|turno|reserv|valorac|consulta/.test(s)) return ofrecer('¡Claro que sí! 😊');
  if(/gracias|perfecto|listo|genial|^ok/.test(s)) return [ia('¡A usted! Aquí estoy para lo que necesite. Que tenga un excelente día.')];
  if(/^(hola|buen|saludos|hey)/.test(s)) return [ia(C.saludo)];
  return ofrecer(C.otro);
}
function enviar(t){
  t=t.trim(); if(!t) return;
  msg(t,'out');
  if(t==='✅ Confirmar'){
    const pasos=[ia('¡Gracias! Su asistencia está confirmada ✅ Le esperamos.')];
    if(C.resena) pasos.push(pausa(1800), separador('DESPUÉS DE SU VISITA (SIMULADO)'), ia('¡Gracias por visitarnos! ¿Nos regala su opinión? ⭐⭐⭐⭐⭐', ()=>botones(['Dejar reseña en Google'])));
    responder(pasos); return;
  }
  if(t==='🔁 Reprogramar'){ esperandoHora=true; responder([ia('Sin problema 😊 '+oferta(), ()=>botones(C.horas))]); return; }
  if(t==='Dejar reseña en Google'){ responder([ia('¡Muchas gracias! Su opinión ayuda a otras personas a encontrarnos 💛')]); return; }
  responder(intencion(t));
}

async function iniciar(){
  if(!id || !/^[a-z0-9-]{3,40}$/.test(id)) throw new Error('sin id');
  const r = await fetch('c/'+id+'.json', {cache:'no-store'});
  if(!r.ok) throw new Error('no existe');
  C = await r.json();
  document.title = C.nombre+' · Asistente (demo)';
  document.getElementById('nom').textContent = C.nombre;
  document.getElementById('logo').src = C.logo;
  document.getElementById('app').hidden = false;
  document.getElementById('f').onsubmit = e=>{ e.preventDefault(); const q=document.getElementById('q'); enviar(q.value); q.value=''; };
  setTimeout(()=>responder([ia(C.saludo)]), 600);
}
iniciar().catch(()=>{ document.getElementById('vacio').hidden = false; });
</script>
</body>
</html>
